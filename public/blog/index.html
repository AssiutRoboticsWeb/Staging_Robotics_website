<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog — Assiut Robotics</title>
    <meta name="description"
        content="Explore the latest insights, technical articles, and project updates from the Assiut Robotics student team.">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../main/footerAndheader.css" />

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="../all-images/logo.ico" />

    <!-- AOS Animation Library -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../utiles/constants.js"></script>
    <script src="../config/server-config.js"></script>
</head>

<body class="blog-page">

    <!-- Header Placeholder -->
    <div id="myUniqueHeaderID"></div>

    <main class="page-container">
        <!-- Blog Page Header -->
        <header class="header" data-aos="fade-down">
            <img class="logo" src="../all-images/logo.png" alt="Assiut Robotics Logo">
            <div class="header-div">
                <h1>The Assiut Robotics</h1>
                <span>INSIGHTS & UPDATES</span>
            </div>
        </header>

        <!-- Pinned Blog Section -->
        <section class="pinned-container" aria-label="Featured Blog">
            <!-- Pinned blog will be injected here by script.js -->
            <div class="blog-loading-placeholder">
                <div class="skeleton-card"></div>
            </div>
        </section>

        <!-- Unpinned Blogs Grid -->
        <section class="unPinnedBlogs" aria-label="Recent Blogs">
            <!-- Other blogs will be injected here by script.js -->
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="myUniqueFooterID"></div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="../main/footerAndheader.js" defer></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({
                duration: 800,
                easing: 'ease-in-out',
                once: true,
                offset: 100
            });
        });
    </script>
</body>

</html>
