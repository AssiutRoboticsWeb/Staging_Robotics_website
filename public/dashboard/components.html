<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Inventory | Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
    <script src="../config/server-config.js"></script>
    <script src="../js/api.js"></script>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-robot"></i> Assiut Robotics
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> Overview</a></li>
            <li><a href="components.html" class="active"><i class="fas fa-microchip"></i> Inventory</a></li>
            <li><a href="members.html"><i class="fas fa-users"></i> Members</a></li>
            <li><a href="#"><i class="fas fa-calendar-alt"></i> Events</a></li>
            <li><a href="#"><i class="fas fa-tasks"></i> Tasks</a></li>
            <li class="mt-40"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="flex-center gap-15">
                <button id="mobileMenuBtn" class="btn bg-transparent text-white text-lg d-none" aria-label="Toggle Mobile Menu"><i class="fas fa-bars"></i></button>
                <h1>Component Inventory</h1>
            </div>
        </header>

        <div class="data-container">
            <div class="data-container-header">
                <h2>All Components</h2>
                <button class="btn btn-primary" onclick="alert('Add component form coming soon!')">
                    <i class="fas fa-plus"></i> Add Component
                </button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Total Qty</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="componentsTableBody">
                        <tr><td colspan="6" class="text-center">Loading inventory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load Components
            try {
                const res = await window.api.get('/components/getComponents');
                const components = res.data;
                const tbody = document.getElementById('componentsTableBody');
                
                if (components.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No components found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                components.forEach(comp => {
                    let statusBadge = '<span class="badge badge-success">Available</span>';
                    if (comp.borrowedBy && comp.borrowedBy.member) {
                        statusBadge = '<span class="badge badge-danger">Borrowed</span>';
                    } else if (comp.requestToBorrow) {
                        statusBadge = '<span class="badge badge-warning">Requested</span>';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${comp.image}" alt="${comp.title}" class="w-50 h-50 rounded-8 object-cover"></td>
                        <td class="font-semibold">${comp.title}</td>
                        <td>${comp.category || 'N/A'}</td>
                        <td>${comp.total || 1}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-icon btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-icon btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                document.getElementById('componentsTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: red;">Error loading components</td></tr>`;
            }
        });
    </script>
</body>
</html>
