<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password</title>
    <link rel="stylesheet" href="styleChangePassword.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class = "container">
        <h1>Change Password</h1>
        <p></p>
        <form id="step0">
            <input type="email" name="email" id="email" placeholder="Email">
            <button type="submit" class="btn" id="changePass">continue</button>
        </form>
        <form id="step1" class="disabled" >
            <input type="number" name="code" id="code" placeholder="OPT">
            <button type="submit" class="btn"  id="verify">verify</button>
        </form>
        <form id="step2" class="disabled">
            <div class="password-wrapper">
                <input type="password" name="newPassword" id="pass" placeholder="Password">
                <i class='bx bxs-show toggle-password'></i>
            </div>
            <div class="password-wrapper">
                <input type="password" id="confirm" placeholder="confirm Password">
                <i class='bx bxs-show toggle-password'></i>
            </div>
            <button type="submit" class="btn"  id="change">Change password</button>
        </form>

        <!-- binooo -->
        <div class="bino load disabling">
            <div class="bino_head">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
        </div>
    </div>
    <script src="../utiles/constants.js"></script>
    <script src="../config/server-config.js"></script>
    <script src="appchangePass.js"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function(toggle) {
            toggle.addEventListener('click', function() {
                const wrapper = this.closest('.password-wrapper');
                const input = wrapper.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('bxs-show');
                    this.classList.add('bxs-hide');
                } else {
                    input.type = 'password';
                    this.classList.remove('bxs-hide');
                    this.classList.add('bxs-show');
                }
            });
        });
    </script>
</body>
</html>
