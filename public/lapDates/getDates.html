<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Schedule</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../main/footerAndheader.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

    <div id="myUniqueHeaderID"></div>


    <div class="container">

        <header class="header">
            <div class="header-content">
                <h1>Lab Schedule</h1>
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <div class="calendar-container">
            <table class="calendar" id="calendar">
                <thead>
                    <tr>
                        <th>Time</th>
                        <!-- سيتم ملء أيام الأسبوع ديناميكياً -->
                    </tr>
                </thead>
                <tbody>
                    <!-- سيتم ملء الجدول ديناميكياً -->
                </tbody>
            </table>
        </div>

        <!-- Popup for member details -->
        <div class="popup-overlay" id="popup">
            <div class="popup-content">
                <button class="close-popup" onclick="closePopup()">×</button>
                <div class="member-info" id="memberInfo">
                    <!-- سيتم ملؤه ديناميكياً -->
                </div>
                <div class="appointment-info" id="appointmentInfo">
                    <!-- سيتم ملؤه ديناميكياً -->
                </div>
            </div>
        </div>

    </div>

    <!--Footer-->
    <div id="myUniqueFooterID"></div>

    <!-- Include Server Configuration -->
    <script src="../utiles/constants.js"></script>
    <script src="../config/server-config.js"></script>
    <script src="../main/footerAndheader.js"></script>
    <script src="script.js"></script>

</body>

</html>
