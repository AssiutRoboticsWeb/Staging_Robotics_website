<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings Schedule</title>

    <!-- Bootstrap -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Raleway:900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700&amp;subset=latin-ext"
        rel="stylesheet" />

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <link rel="stylesheet" href="../main/footerAndheader.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <!-- header -->
    <div id="myUniqueHeaderID">
        </div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Meetings Schedule</h2>
            <button class="btn btn-dark" onclick="toggleDarkMode()">🌙</button>
        </div>

        <div id="meetingsContainer" class="row"></div>

        <div id="calendarContainer" style="display:none;">
            <h3 id="meetingTitle" class="text-center"></h3>

            <input class="form-control my-3" id="timeFilter" placeholder="Search time...">

            <ul class="nav nav-tabs" id="dayTabs"></ul>
            <div class="tab-content mt-3" id="dayTabsContent"></div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="timeSlotModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 id="timeSlotTitle"></h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="bookedMembersList"></div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary" id="bookTimeSlot">Book Slot</button>
                </div>

            </div>
        </div>
    </div>

    <!-- footer -->
    <div id="myUniqueFooterID"></div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="../utiles/constants.js"></script>
    <script src="../config/server-config.js"></script>

    <script src="../main/footerAndheader.js"></script>




    <!-- Custom Script -->
    <script src="script.js"></script>



</body>

</html>
